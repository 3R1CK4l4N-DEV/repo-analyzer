[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devanalyzer"
version = "0.1.0"
description = "Multi-language project analyzer: structure, dependencies, knowledge graph and AI-assisted business rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6,<1",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "networkx>=3.2",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.10,<2"]
mcp = ["mcp>=1.10,<2"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]

[project.scripts]
devanalyzer = "devanalyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestRemovedIn10Warning"]
