name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      repo:
        description: "Repo extra a analizar: owner/name o URL"
        required: false
        type: string
      ref:
        description: "Ref del repo extra"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - uses: actions/configure-pages@v6
        id: pages
      - name: Build publication data
        shell: bash
        env:
          EXTRA_REPO: ${{ inputs.repo }}
          EXTRA_REF: ${{ inputs.ref }}
          BASELINE_URL: ${{ steps.pages.outputs.base_url }}/data
        run: |
          ARGS=()
          if [[ -n "$EXTRA_REPO" ]]; then
            EXTRA="$EXTRA_REPO"
            if [[ -n "$EXTRA_REF" ]]; then
              EXTRA="${EXTRA}@${EXTRA_REF}"
            fi
            ARGS+=(--extra "$EXTRA")
          fi
          devanalyzer publish site site/repos.json --out site/public/data --baseline-url "$BASELINE_URL" "${ARGS[@]}"
      - run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
