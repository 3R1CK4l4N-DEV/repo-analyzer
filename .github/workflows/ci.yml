name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]" ruff
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -q
      - name: Smoke test CLI on fixtures
        run: |
          devanalyzer analyze tests/fixtures/java_spring --show endpoints
          devanalyzer graph build tests/fixtures/node_nest --out out_graph
          devanalyzer report tests/fixtures/python_fastapi --out out_report.html
